<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dónde desayunar</title>
<meta name="description" content="Mapa de sitios para desayunar. Busca una dirección o usa tu ubicación y ordena los sitios por cercanía.">
<meta name="referrer" content="strict-origin-when-cross-origin">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
  :root {
    --ink: #12302d;
    --ink-suave: #3d5a56;
    --papel: #f2f6f4;
    --tarjeta: #ffffff;
    --linea: #d3dfda;
    --yema: #f4b32a;
    --azul: #0b6bcb;
    --fuente-titulo: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --fuente-texto: "Figtree", "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html { scroll-padding-top: 12px; }

  body {
    margin: 0;
    background: var(--papel);
    color: var(--ink);
    font-family: var(--fuente-texto);
    font-size: 1rem;
    line-height: 1.5;
  }

  :focus-visible {
    outline: 3px solid var(--azul);
    outline-offset: 2px;
  }

  .sr {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- Cabecera ---------- */
  .cabecera {
    background: var(--ink);
    color: #fff;
    padding: 28px 20px 22px;
  }

  .cabecera-in {
    max-width: 1240px;
    margin: 0 auto;
  }

  .cabecera h1 {
    margin: 0 0 6px;
    font-family: var(--fuente-titulo);
    font-weight: 800;
    font-size: clamp(2rem, 5.5vw, 3.4rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
  }

  .cabecera p.intro {
    margin: 0 0 18px;
    max-width: 52ch;
    color: #cfe0db;
  }

  .buscador {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .buscador input {
    flex: 1 1 260px;
    min-width: 0;
    height: 48px;
    padding: 0 14px;
    border: 0;
    border-radius: 10px;
    font: inherit;
    color: var(--ink);
    background: #fff;
  }

  .btn {
    height: 48px;
    padding: 0 18px;
    border-radius: 10px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    border: 2px solid transparent;
  }

  .btn-primario { background: var(--yema); color: var(--ink); }
  .btn-primario:hover { background: #ffc54d; }

  .btn-secundario { background: transparent; color: #fff; border-color: #6f8d88; }
  .btn-secundario:hover { border-color: #fff; }

  .estado {
    min-height: 1.5em;
    margin: 12px 0 0;
    font-size: 0.95rem;
    color: #cfe0db;
  }
  .estado.error { color: #ffd7a8; }

  /* ---------- Contenido ---------- */
  .contenido {
    max-width: 1240px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(320px, 430px) 1fr;
    align-items: start;
  }

  .panel { padding: 20px; }

  .filtros {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }

  .chip {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--linea);
    background: var(--tarjeta);
    color: var(--ink);
    font: inherit;
    font-size: 0.92rem;
    font-weight: 500;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--ink); }
  .chip[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }

  .resumen {
    margin: 0 0 12px;
    color: var(--ink-suave);
    font-size: 0.95rem;
  }

  .lista {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 12px;
  }

  .tarjeta {
    background: var(--tarjeta);
    border: 1px solid var(--linea);
    border-radius: 12px;
    overflow: hidden;
  }
  .tarjeta.activa {
    border-color: var(--ink);
    box-shadow: 0 0 0 2px var(--yema);
  }

  .tarjeta-cuerpo {
    display: grid;
    gap: 2px;
    width: 100%;
    padding: 14px 16px 12px;
    text-align: left;
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    cursor: pointer;
  }

  .tarjeta-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }

  .nombre { font-weight: 600; font-size: 1.08rem; }
  .dist { font-weight: 600; color: var(--azul); white-space: nowrap; font-size: 0.95rem; }
  .tipo { color: var(--ink-suave); font-size: 0.92rem; }
  .dir { color: var(--ink-suave); font-size: 0.92rem; }
  .nota { margin-top: 4px; font-size: 0.92rem; }

  .acciones {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    padding: 10px 16px;
    border-top: 1px solid var(--linea);
    background: #f8fbfa;
  }

  .acciones a, .pop a {
    color: var(--ink);
    font-weight: 600;
    font-size: 0.92rem;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--yema);
    text-decoration-thickness: 2px;
  }
  .acciones a:hover, .pop a:hover { text-decoration-color: var(--ink); }

  .vacio {
    padding: 18px;
    border: 1.5px dashed var(--linea);
    border-radius: 12px;
    color: var(--ink-suave);
  }

  /* ---------- Mapa ---------- */
  .mapa-wrap {
    position: sticky;
    top: 0;
    height: 100vh;
    height: 100dvh;
  }

  #mapa { height: 100%; width: 100%; background: #dfe8e4; }

  .pin-wrap { background: none; border: 0; }
  .pin {
    display: block;
    width: 26px; height: 26px;
    margin: 2px;
    background: var(--yema);
    border: 3px solid var(--ink);
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    position: relative;
  }
  .pin::after {
    content: "";
    position: absolute;
    inset: 5px;
    background: var(--ink);
    border-radius: 50%;
  }
  .pin-wrap.activo .pin { background: var(--ink); }
  .pin-wrap.activo .pin::after { background: var(--yema); }

  .leaflet-popup-content { font-family: var(--fuente-texto); margin: 12px 14px; }
  .pop { display: grid; gap: 3px; }
  .pop strong { font-size: 1.02rem; }
  .pop span { color: var(--ink-suave); font-size: 0.92rem; }
  .pop a { margin-top: 6px; }

  /* ---------- Móvil ---------- */
  @media (max-width: 820px) {
    .contenido { grid-template-columns: 1fr; }
    .mapa-wrap { position: static; height: 52vh; height: 52dvh; order: -1; }
    .panel { padding: 16px; }
    .cabecera { padding: 22px 16px 18px; }
    .buscador .btn { flex: 1 1 auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; }
  }
</style>
</head>

<body>
  <header class="cabecera">
    <div class="cabecera-in">
      <h1>Dónde desayunar</h1>
      <p class="intro">Escribe una dirección o usa tu ubicación y verás los sitios ordenados de más cerca a más lejos.</p>

      <form id="form-busqueda" class="buscador" role="search">
        <label class="sr" for="direccion">Dirección, barrio o ciudad</label>
        <input id="direccion" type="search" placeholder="Calle, barrio o ciudad" autocomplete="off">
        <button type="submit" class="btn btn-primario">Buscar</button>
        <button type="button" id="btn-ubicacion" class="btn btn-secundario">Usar mi ubicación</button>
      </form>

      <p id="estado" class="estado" role="status" aria-live="polite"></p>
    </div>
  </header>

  <main class="contenido">
    <section class="panel" aria-label="Lista de sitios">
      <div id="filtros" class="filtros" role="group" aria-label="Filtrar por tipo"></div>
      <p id="resumen" class="resumen"></p>
      <ol id="lista" class="lista"></ol>
    </section>

    <div class="mapa-wrap">
      <div id="mapa" role="region" aria-label="Mapa de sitios"></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ---------- Utilidades ----------
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const esMovil = () => matchMedia('(max-width: 820px)').matches;

    function estado(texto, esError = false) {
      const el = $('#estado');
      el.textContent = texto;
      el.classList.toggle('error', esError);
    }

    function formatoDistancia(m) {
      if (m < 1000) return Math.round(m / 10) * 10 + ' m';
      return (m / 1000).toLocaleString('es-ES', { maximumFractionDigits: 1 }) + ' km';
    }

    // Google Maps se abre buscando el sitio por nombre + dirección (no por coordenadas)
    const textoMaps = (r) => [r.nombre, r.direccion].filter(Boolean).join(', ');
    const urlVer = (r) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(textoMaps(r));
    const urlRuta = (r) => 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(textoMaps(r));

    // ---------- Mapa ----------
    const CENTRO_INICIAL = [36.8381, -2.4597];
    const mapa = L.map('mapa').setView(CENTRO_INICIAL, 13);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(mapa);

    const icono = L.divIcon({
      className: 'pin-wrap',
      html: '<span class="pin"></span>',
      iconSize: [28, 34],
      iconAnchor: [14, 34],
      popupAnchor: [0, -30]
    });

    // ---------- Estado ----------
    let sitios = [];          // { i, r, marcador, dist }
    let filtro = 'Todos';
    let origen = null;
    let activo = null;
    let marcadorOrigen = null;
    let circuloPrecision = null;

    const visibles = () => sitios.filter((s) => filtro === 'Todos' || s.r.tipo === filtro);

    function popupHtml(r) {
      return `<div class="pop">
        <strong>${esc(r.nombre)}</strong>
        ${r.tipo ? `<span>${esc(r.tipo)}</span>` : ''}
        ${r.direccion ? `<span>${esc(r.direccion)}</span>` : ''}
        <a href="${urlVer(r)}" target="_blank" rel="noopener">Ver en Google Maps</a>
      </div>`;
    }

    function tarjetaHtml(s) {
      const r = s.r;
      return `<li class="tarjeta" id="t-${s.i}">
        <button type="button" class="tarjeta-cuerpo" data-i="${s.i}">
          <span class="tarjeta-top">
            <span class="nombre">${esc(r.nombre)}</span>
            ${s.dist != null ? `<span class="dist">${formatoDistancia(s.dist)}</span>` : ''}
          </span>
          ${r.tipo ? `<span class="tipo">${esc(r.tipo)}</span>` : ''}
          ${r.direccion ? `<span class="dir">${esc(r.direccion)}</span>` : ''}
          ${r.nota ? `<span class="nota">${esc(r.nota)}</span>` : ''}
        </button>
        <div class="acciones">
          <a href="${urlVer(r)}" target="_blank" rel="noopener">Ver en Google Maps</a>
          <a href="${urlRuta(r)}" target="_blank" rel="noopener">Cómo llegar</a>
          ${r.web ? `<a href="${esc(r.web)}" target="_blank" rel="noopener">Web</a>` : ''}
        </div>
      </li>`;
    }

    function pintar() {
      const vis = visibles();
      if (origen) vis.sort((a, b) => a.dist - b.dist);

      sitios.forEach((s) => (vis.includes(s) ? s.marcador.addTo(mapa) : s.marcador.remove()));

      $('#lista').innerHTML = vis.length
        ? vis.map(tarjetaHtml).join('')
        : '<li class="vacio">No hay sitios de este tipo. Prueba con otro filtro.</li>';

      $('#resumen').textContent = origen
        ? `${vis.length} ${vis.length === 1 ? 'sitio' : 'sitios'}, del más cercano al más lejano`
        : `${vis.length} ${vis.length === 1 ? 'sitio' : 'sitios'}. Busca una dirección para ordenarlos por cercanía.`;

      if (activo && vis.includes(activo)) marcarActivo(activo, true);
    }

    function marcarActivo(s, si) {
      s.marcador.getElement()?.classList.toggle('activo', si);
      document.getElementById('t-' + s.i)?.classList.toggle('activa', si);
    }

    function destacar(s, volar) {
      if (activo) marcarActivo(activo, false);
      activo = s;
      marcarActivo(s, true);

      if (volar) {
        mapa.setView(s.marcador.getLatLng(), Math.max(mapa.getZoom(), 16), { animate: !reduceMotion });
        s.marcador.openPopup();
        if (esMovil()) {
          $('.mapa-wrap').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
        }
      } else {
        document.getElementById('t-' + s.i)?.scrollIntoView({
          block: 'nearest',
          behavior: reduceMotion ? 'auto' : 'smooth'
        });
      }
    }

    function construirFiltros() {
      const tipos = ['Todos', ...new Set(sitios.map((s) => s.r.tipo).filter(Boolean))];
      const cont = $('#filtros');
      if (tipos.length <= 2) { cont.hidden = true; return; }
      cont.innerHTML = tipos
        .map((t) => `<button type="button" class="chip" aria-pressed="${t === filtro}" data-tipo="${esc(t)}">${esc(t)}</button>`)
        .join('');
    }

    // ---------- Punto de referencia (tu ubicación o una dirección) ----------
    function fijarOrigen(latlng, etiqueta, precision) {
      origen = L.latLng(latlng);

      marcadorOrigen?.remove();
      circuloPrecision?.remove();

      marcadorOrigen = L.circleMarker(origen, {
        radius: 8, color: '#ffffff', weight: 3, fillColor: '#0b6bcb', fillOpacity: 1
      }).addTo(mapa).bindTooltip(esc(etiqueta));

      if (precision && precision < 2000) {
        circuloPrecision = L.circle(origen, {
          radius: precision, color: '#0b6bcb', weight: 1, fillOpacity: 0.08
        }).addTo(mapa);
      }

      sitios.forEach((s) => { s.dist = origen.distanceTo(s.marcador.getLatLng()); });
      pintar();

      const cercanos = visibles()
        .sort((a, b) => a.dist - b.dist)
        .slice(0, 3)
        .map((s) => s.marcador.getLatLng());

      mapa.fitBounds(L.latLngBounds([origen, ...cercanos]).pad(0.25), {
        maxZoom: 16,
        animate: !reduceMotion
      });
    }

    // ---------- Buscar dirección (Nominatim / OpenStreetMap) ----------
    $('#form-busqueda').addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = $('#direccion').value.trim();
      if (!q) { estado('Escribe una dirección, barrio o ciudad.', true); return; }

      estado('Buscando…');
      try {
        const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=es&q='
          + encodeURIComponent(q);
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const datos = await res.json();

        if (!datos.length) {
          estado('No encuentro esa dirección. Prueba con la calle y la ciudad.', true);
          return;
        }
        const d = datos[0];
        fijarOrigen([parseFloat(d.lat), parseFloat(d.lon)], d.display_name);
        estado('Sitios cerca de: ' + d.display_name.split(',').slice(0, 3).join(','));
      } catch (err) {
        estado('No se pudo buscar ahora. Inténtalo de nuevo en un momento.', true);
      }
    });

    // ---------- Usar mi ubicación ----------
    function ubicar() {
      if (!navigator.geolocation) {
        estado('Tu navegador no permite obtener la ubicación. Escribe una dirección.', true);
        return;
      }
      estado('Obteniendo tu ubicación…');
      navigator.geolocation.getCurrentPosition(
        (p) => {
          fijarOrigen([p.coords.latitude, p.coords.longitude], 'Tu ubicación', p.coords.accuracy);
          estado('Ordenado por cercanía a tu ubicación.');
        },
        (err) => {
          const mensajes = {
            1: 'Permiso de ubicación denegado. Actívalo en los ajustes del sitio o escribe una dirección.',
            2: 'No se pudo determinar tu posición. Escribe una dirección.',
            3: 'La ubicación tardó demasiado. Inténtalo de nuevo o escribe una dirección.'
          };
          estado(mensajes[err.code] || 'No se pudo obtener tu ubicación.', true);
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
      );
    }
    $('#btn-ubicacion').addEventListener('click', ubicar);

    // ---------- Eventos de lista y filtros ----------
    $('#lista').addEventListener('click', (e) => {
      const b = e.target.closest('.tarjeta-cuerpo');
      if (!b) return;
      destacar(sitios[Number(b.dataset.i)], true);
    });

    $('#filtros').addEventListener('click', (e) => {
      const b = e.target.closest('.chip');
      if (!b) return;
      filtro = b.dataset.tipo;
      document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
      pintar();
    });

    // ---------- Carga de datos ----------
    fetch('restaurantes.json')
      .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then((lista) => {
        sitios = lista.map((r, i) => {
          const marcador = L.marker([r.lat, r.lng], { icon: icono, title: r.nombre })
            .bindPopup(popupHtml(r));
          const s = { i, r, marcador, dist: null };
          marcador.on('click', () => destacar(s, false));
          return s;
        });

        construirFiltros();
        pintar();

        if (sitios.length) {
          mapa.fitBounds(L.latLngBounds(sitios.map((s) => s.marcador.getLatLng())).pad(0.2));
        }

        // Si ya diste permiso de ubicación antes, se usa solo; si no, hay que pulsar el botón
        if (navigator.permissions) {
          navigator.permissions.query({ name: 'geolocation' })
            .then((p) => { if (p.state === 'granted') ubicar(); })
            .catch(() => {});
        }
      })
      .catch(() => {
        estado('No se pudo cargar restaurantes.json. Abre la web desde su URL publicada o desde un servidor local, no con doble clic.', true);
      });
  </script>
</body>
</html>
